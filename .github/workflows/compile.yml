name: Compilar Driver RTL8188EU Kernel 6.6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses-dev libssl-dev libelf-dev flex bison git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Clonar fuente del Kernel 6.6 con driver r8188eu (staging)
        run: |
          git clone --depth 1 -b linux-6.6.y https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git kernel

      - name: Compilar modulo r8188eu para AArch64
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/staging/rtl8188eu modules

      - name: Guardar archivo .ko
        run: |
          mkdir output
          find kernel/drivers/staging/rtl8188eu -name "*.ko" -exec cp {} output/ \;

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: driver-r8188eu-kernel6.6
          path: output/*.ko
